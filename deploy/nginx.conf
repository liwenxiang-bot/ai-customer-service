# 生产 nginx 站点配置（用你服务器已有的 nginx）
# 放到 /etc/nginx/conf.d/acs.conf（或 sites-available/ 并软链到 sites-enabled/）
# 把 chat.example.com / admin.example.com 改成你的真实域名后：
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS 证书用 certbot 自动签发：
#   sudo certbot --nginx -d chat.example.com -d admin.example.com
# certbot 会自动追加 443 server 块、配置证书并加 80→443 跳转。
#
# 前提：docker 全栈已起，backend 在本机 :8000、admin 在本机 :8080（= .env 的 ADMIN_PORT）。

# ── 对话端（公开）：widget.js / /chat / /api / WebSocket 都在 backend ──
server {
    listen 80;
    listen [::]:80;
    server_name chat.example.com;

    client_max_body_size 20m;   # 知识库导入 / 附件

    # WebSocket（流式对话）—— 必须有 Upgrade 头，否则连不上
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;   # 长连接
    }

    # 其余：/embed/widget.js、/chat、/api/chat、/health
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 指标不对外
    location /metrics { deny all; }
}

# ── 运营后台（建议限制访问）：admin 容器（其内部 nginx 再代理 /api、/ws 到 backend）──
server {
    listen 80;
    listen [::]:80;
    server_name admin.example.com;

    client_max_body_size 20m;

    # 可选：仅允许你的办公网 IP 访问后台
    # allow 1.2.3.4;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:8080;   # = .env 里的 ADMIN_PORT
        # ⚠️ 这 3 行（http_version 1.1 + Upgrade + Connection）是后台实时 WebSocket
        # (/ws/admin) 的命脉，千万别删！少了它 ws/admin 会每 ~200ms 断一次疯狂重连，
        # 坐席工作台退化成轮询：消息不实时、「正在输入」提示失效。certbot 改写或手动
        # 精简配置时最容易把这段弄丢。
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
}

# ── 坐席工作台（推荐独立子域名）──
# 坐席站是后端挂在 /agent 下的独立 SPA。用独立子域名把它和面向客户的 chat 域名分开
# （更适合手机 PWA、便于单独加访问控制）。做法：子域名根 `/` 重写到后端的 /agent/，
# 而 /api、/ws 直连后端不加前缀。配好后到 .env 设 AGENT_CONSOLE_URL=https://agent.example.com
# （否则转人工通知的深链仍指向 {APP_BASE_URL}/agent）。
server {
    listen 80;
    listen [::]:80;
    server_name agent.example.com;

    client_max_body_size 20m;

    # 可选：仅允许你的办公网/坐席 IP 访问
    # allow 1.2.3.4;
    # deny all;

    # 坐席站实时消息（/ws/admin）——Upgrade 头必须有，否则退化成轮询
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
    }

    # 管理 API（/api/admin）直连后端，不加 /agent 前缀
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其余（坐席站静态资源）→ 后端的 /agent 目录：proxy_pass 带 URI，nginx 会把
    # location 前缀 `/` 替换成 `/agent/`（`/` → `/agent/`、`/assets/x` → `/agent/assets/x`）。
    location / {
        proxy_pass http://127.0.0.1:8000/agent/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
